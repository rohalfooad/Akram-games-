// ---------- chess logic ----------
const G={p:'♟',R:'♜',N:'♞',B:'♝',Q:'♛',K:'♚',P:'♟'};
const START=()=>{const b=Array(64).fill('');const bk='RNBQKBNR';for(let i=0;i<8;i++){b[i]='b'+bk[i];b[8+i]='bP';b[48+i]='wP';b[56+i]='w'+bk[i]}return b};
function moves(b,i){const p=b[i],c=p[0],t=p[1],r=i>>3,f=i&7,o=[];
 const add=(rr,ff,co,nc)=>{if(rr<0||rr>7||ff<0||ff>7)return false;const q=b[rr*8+ff];if(q&&q[0]===c)return false;if(q&&nc)return false;if(!q&&co)return false;o.push(rr*8+ff);return !q};
 const O=[[1,0],[-1,0],[0,1],[0,-1]],D=[[1,1],[1,-1],[-1,1],[-1,-1]];
 if(t==='P'){const d=c==='w'?-1:1;if(add(r+d,f,0,1)&&r===(c==='w'?6:1))add(r+2*d,f,0,1);add(r+d,f-1,1);add(r+d,f+1,1)}
 else if(t==='N')[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([a,z])=>add(r+a,f+z));
 else if(t==='K')O.concat(D).forEach(([a,z])=>add(r+a,f+z));
 else{const dirs=t==='R'?O:t==='B'?D:O.concat(D);dirs.forEach(([a,z])=>{for(let k=1;k<8;k++)if(!add(r+a*k,f+z*k))break})}
 return o}
// ---------- full chess rules ----------
function attacked(b,sq,by){const r=sq>>3,f=sq&7,d=by==='w'?1:-1;
 for(const df of[-1,1]){const rr=r+d,ff=f+df;if(rr>=0&&rr<8&&ff>=0&&ff<8&&b[rr*8+ff]===by+'P')return true}
 for(const[a,z]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]){const rr=r+a,ff=f+z;if(rr>=0&&rr<8&&ff>=0&&ff<8&&b[rr*8+ff]===by+'N')return true}
 for(let a=-1;a<=1;a++)for(let z=-1;z<=1;z++){if(!a&&!z)continue;const rr=r+a,ff=f+z;if(rr>=0&&rr<8&&ff>=0&&ff<8&&b[rr*8+ff]===by+'K')return true;
  for(let k=1;;k++){const r2=r+a*k,f2=f+z*k;if(r2<0||r2>7||f2<0||f2>7)break;const q=b[r2*8+f2];if(q){if(q[0]===by&&(q[1]==='Q'||q[1]===((a&&z)?'B':'R')))return true;break}}}
 return false}
const inCheck=(b,c)=>{const k=b.indexOf(c+'K');return k>=0&&attacked(b,k,c==='w'?'b':'w')};
const dcr=b=>(b[60]==='wK'&&b[63]==='wR'?'K':'')+(b[60]==='wK'&&b[56]==='wR'?'Q':'')+(b[4]==='bK'&&b[7]==='bR'?'k':'')+(b[4]==='bK'&&b[0]==='bR'?'q':'');
function mk(b,cr,ep,f,t,pr){const n=b.slice(),p=n[f],c=p[0],ty=p[1];let nc=cr||'',ne=-1;const rm=ch=>{nc=nc.split(ch).join('')};
 if(ty==='P'&&t===ep&&(f&7)!==(t&7)&&!b[t])n[(f>>3)*8+(t&7)]='';
 n[t]=p;n[f]='';
 if(ty==='P'&&Math.abs((t>>3)-(f>>3))===2)ne=(f+t)/2;
 if(ty==='K'&&Math.abs((t&7)-(f&7))===2){if(t>f){n[t-1]=n[t+1];n[t+1]=''}else{n[t+1]=n[t-2];n[t-2]=''}}
 if(ty==='P'&&((t>>3)===0||(t>>3)===7))n[t]=c+(pr||'Q');
 if(ty==='K'){if(c==='w'){rm('K');rm('Q')}else{rm('k');rm('q')}}
 [[56,'Q'],[63,'K'],[0,'q'],[7,'k']].forEach(([q,ch])=>{if(f===q||t===q)rm(ch)});
 return{b:n,cr:nc,ep:ne}}
function lmoves(G,i){const b=G.b,p=b[i],c=p[0],o=c==='w'?'b':'w';let ms=moves(b,i);
 if(p[1]==='P'&&G.ep>=0){const d=c==='w'?-1:1;if(G.ep>>3===(i>>3)+d&&Math.abs((G.ep&7)-(i&7))===1)ms=ms.concat([G.ep])}
 if(p[1]==='K'&&i===(c==='w'?60:4)&&!attacked(b,i,o)){const rk=G.cr||'',h=i;
  if(rk.includes(c==='w'?'K':'k')&&!b[h+1]&&!b[h+2]&&b[h+3]===c+'R'&&!attacked(b,h+1,o)&&!attacked(b,h+2,o))ms.push(h+2);
  if(rk.includes(c==='w'?'Q':'q')&&!b[h-1]&&!b[h-2]&&!b[h-3]&&b[h-4]===c+'R'&&!attacked(b,h-1,o)&&!attacked(b,h-2,o))ms.push(h-2)}
 return ms.filter(t=>!inCheck(mk(b,G.cr,G.ep,i,t).b,c))}
function status(G){const c=G.turn;for(let i=0;i<64;i++)if(G.b[i]&&G.b[i][0]===c&&lmoves(G,i).length)return'';return inCheck(G.b,c)?'mate':'stale'}
