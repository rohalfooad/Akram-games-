name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
env:
  # الرقم السري لإظهار التطبيق: اتصل بـ *#*#1234#*#*  (غيّر 1234 إن أردت)
  DIAL_CODE: "1234"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Write Android patch files
        run: |
          mkdir -p native
          cat > patch.py <<'PY'
          import os, re, glob
          code = os.environ.get("DIAL_CODE", "1234")
          mf = "android/app/src/main/AndroidManifest.xml"
          m = open(mf, encoding="utf-8").read()
          pat = r'<intent-filter>\s*<action android:name="android.intent.action.MAIN"\s*/>\s*<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>'
          assert re.search(pat, m), "launcher intent-filter not found"
          m = re.sub(pat, "", m, count=1)
          alias = '''
              <activity-alias android:name=".LauncherAlias" android:targetActivity=".MainActivity" android:enabled="true" android:exported="true"
                  android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity-alias>
              <receiver android:name=".SecretReceiver" android:exported="true">
                  <intent-filter>
                      <action android:name="android.provider.Telephony.SECRET_CODE" />
                      <data android:scheme="android_secret_code" android:host="%s" />
                  </intent-filter>
              </receiver>
          ''' % code
          assert "</application>" in m
          m = m.replace("</application>", alias + "\n    </application>", 1)
          perms = "".join('    <uses-permission android:name="android.permission.%s" />\n' % p for p in ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "VIBRATE"])
          m = m.replace("</manifest>", perms + "</manifest>", 1)
          open(mf, "w", encoding="utf-8").write(m)
          ma = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
          pkg = re.search(r"package\s+([\w.]+);", open(ma, encoding="utf-8").read()).group(1)
          d = os.path.dirname(ma)
          for src, dst in [("native/MainActivity.java.tpl", "MainActivity.java"), ("native/SecretReceiver.java.tpl", "SecretReceiver.java")]:
              open(os.path.join(d, dst), "w", encoding="utf-8").write(open(src, encoding="utf-8").read().replace("PKG", pkg))
          print("patched", pkg)
          PY
          cat > native/MainActivity.java.tpl <<'JAVA'
          package PKG;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.DocumentsContract;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.IntentSenderRequest;
          import androidx.activity.result.contract.ActivityResultContracts;
          import com.getcapacitor.BridgeActivity;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private ActivityResultLauncher<Intent> pickLauncher;
            private ActivityResultLauncher<IntentSenderRequest> delLauncher;
            private final List<Uri> picked = new ArrayList<>();
            private final List<Uri> toDelete = new ArrayList<>();
            private final HashMap<Integer, InputStream> streams = new HashMap<>();
            private final HashMap<Integer, Long> pos = new HashMap<>();
            private final Handler handler = new Handler(Looper.getMainLooper());

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              pickLauncher = registerForActivityResult(new ActivityResultContracts.StartActivityForResult(), r -> {
                if (r.getResultCode() != Activity.RESULT_OK || r.getData() == null) return;
                Intent d = r.getData();
                closeStreams();
                picked.clear();
                if (d.getClipData() != null) {
                  for (int k = 0; k < d.getClipData().getItemCount(); k++) picked.add(d.getClipData().getItemAt(k).getUri());
                } else if (d.getData() != null) {
                  picked.add(d.getData());
                }
                final int n = picked.size();
                getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript("window.onPicked(" + n + ")", null));
              });
              delLauncher = registerForActivityResult(new ActivityResultContracts.StartIntentSenderForResult(), r -> { });
              getBridge().getWebView().addJavascriptInterface(new Hider(), "AndroidHider");
              getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
            }

            private void closeStreams() {
              for (InputStream s : streams.values()) {
                try { s.close(); } catch (Exception e) { }
              }
              streams.clear();
              pos.clear();
            }

            private Uri toMedia(Uri u) {
              try {
                if (DocumentsContract.isDocumentUri(this, u) && "com.android.providers.media.documents".equals(u.getAuthority())) {
                  String id = DocumentsContract.getDocumentId(u);
                  String[] p = id.split(":");
                  Uri base = p[0].equals("video") ? MediaStore.Video.Media.EXTERNAL_CONTENT_URI : MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                  return ContentUris.withAppendedId(base, Long.parseLong(p[1]));
                }
              } catch (Exception e) { }
              return null;
            }

            private void scheduleDelete() {
              handler.removeCallbacksAndMessages(null);
              handler.postDelayed(() -> {
                List<Uri> l;
                synchronized (toDelete) {
                  l = new ArrayList<>(toDelete);
                  toDelete.clear();
                }
                if (l.isEmpty()) return;
                try {
                  if (Build.VERSION.SDK_INT >= 30) {
                    delLauncher.launch(new IntentSenderRequest.Builder(MediaStore.createDeleteRequest(getContentResolver(), l).getIntentSender()).build());
                  } else {
                    for (Uri u : l) getContentResolver().delete(u, null, null);
                  }
                } catch (Exception e) { }
              }, 600);
            }

            public class Hider {
              @JavascriptInterface
              public void hide() {
                runOnUiThread(() -> getPackageManager().setComponentEnabledSetting(new ComponentName(getPackageName(), "PKG.LauncherAlias"), PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP));
              }

              @JavascriptInterface
              public void exit() {
                runOnUiThread(() -> finishAffinity());
              }

              @JavascriptInterface
              public void secure(final boolean on) {
                runOnUiThread(() -> {
                  if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);
                  else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);
                });
              }

              @JavascriptInterface
              public void pick() {
                runOnUiThread(() -> {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_MIME_TYPES, new String[] {"image/*", "video/*"});
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  pickLauncher.launch(i);
                });
              }

              @JavascriptInterface
              public String pickedMeta(int i) {
                try {
                  Uri u = picked.get(i);
                  String name = "file";
                  Cursor c = getContentResolver().query(u, null, null, null, null);
                  if (c != null) {
                    if (c.moveToFirst()) {
                      int ix = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                      if (ix >= 0) name = c.getString(ix);
                    }
                    c.close();
                  }
                  String type = getContentResolver().getType(u);
                  JSONObject o = new JSONObject();
                  o.put("name", name);
                  o.put("type", type == null ? "application/octet-stream" : type);
                  return o.toString();
                } catch (Exception e) {
                  return "{}";
                }
              }

              @JavascriptInterface
              public String pickedRead(int i, int off, int len) {
                try {
                  InputStream in = streams.get(i);
                  Long p = pos.get(i);
                  if (in == null || p == null || p.longValue() != off) {
                    if (in != null) in.close();
                    in = getContentResolver().openInputStream(picked.get(i));
                    long s = 0;
                    while (s < off) {
                      long k = in.skip(off - s);
                      if (k <= 0) break;
                      s += k;
                    }
                    streams.put(i, in);
                  }
                  byte[] buf = new byte[len];
                  int tot = 0;
                  while (tot < len) {
                    int r = in.read(buf, tot, len - tot);
                    if (r < 0) break;
                    tot += r;
                  }
                  if (tot == 0) {
                    in.close();
                    streams.remove(i);
                    return "";
                  }
                  pos.put(i, (long) (off + tot));
                  return Base64.encodeToString(buf, 0, tot, Base64.NO_WRAP);
                } catch (Exception e) {
                  return "";
                }
              }

              @JavascriptInterface
              public String deletePicked(int i) {
                try {
                  Uri m = toMedia(picked.get(i));
                  if (m == null) return "no";
                  synchronized (toDelete) { toDelete.add(m); }
                  runOnUiThread(() -> scheduleDelete());
                  return "ok";
                } catch (Exception e) {
                  return "no";
                }
              }

              @JavascriptInterface
              public String saveMedia(String name, String type, String b64) {
                try {
                  if (Build.VERSION.SDK_INT < 29) return "unsupported";
                  byte[] data = Base64.decode(b64, Base64.DEFAULT);
                  boolean vid = type.startsWith("video/");
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, type);
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, (vid ? "Movies/" : "Pictures/") + "MalikWaMalika");
                  v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                  Uri base = vid ? MediaStore.Video.Media.EXTERNAL_CONTENT_URI : MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                  Uri u = getContentResolver().insert(base, v);
                  OutputStream o = getContentResolver().openOutputStream(u);
                  o.write(data);
                  o.close();
                  v.clear();
                  v.put(MediaStore.MediaColumns.IS_PENDING, 0);
                  getContentResolver().update(u, v, null, null);
                  return "ok";
                } catch (Exception e) {
                  return String.valueOf(e);
                }
              }

              @JavascriptInterface
              public String save(String name, String b64) {
                try {
                  if (Build.VERSION.SDK_INT < 29) return "unsupported";
                  byte[] data = Base64.decode(b64, Base64.DEFAULT);
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                  v.put(MediaStore.Downloads.IS_PENDING, 1);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  OutputStream o = getContentResolver().openOutputStream(u);
                  o.write(data);
                  o.close();
                  v.clear();
                  v.put(MediaStore.Downloads.IS_PENDING, 0);
                  getContentResolver().update(u, v, null, null);
                  return "ok";
                } catch (Exception e) {
                  return String.valueOf(e);
                }
              }
            }
          }
          JAVA
          cat > native/SecretReceiver.java.tpl <<'JAVA'
          package PKG;

          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.widget.Toast;

          public class SecretReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              c.getPackageManager().setComponentEnabledSetting(new ComponentName(c.getPackageName(), "PKG.LauncherAlias"), PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP);
              Toast.makeText(c, "App icon restored", Toast.LENGTH_LONG).show();
            }
          }
          JAVA
      - name: Build web + Android project
        run: |
          mkdir -p www && cp index.html www/index.html
          cp manifest.webmanifest manifest.json icon-192.png www/ 2>/dev/null || true
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "ملك وملكة" com.akram.games --web-dir www
          npx cap add android
          python3 patch.py
          npx cap sync android
      - name: App icon (optional)
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-1024.png assets/icon-only.png
          cp icon-1024.png assets/icon-foreground.png
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#7c5cff' --iconBackgroundColorDark '#0f1226'
      - name: Fix launcher icon if background is missing
        run: |
          R=android/app/src/main/res
          if ! ls $R/mipmap-*/ic_launcher_background.* >/dev/null 2>&1; then
            echo "background missing -> using plain launcher icons"
            rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          fi
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: games-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
